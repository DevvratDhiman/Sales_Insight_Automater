name: CI - Sales Insight Automator

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    services:
      # Optional: if you want a database or Redis later, add here
      # db:
      #   image: postgres:15
      #   ports:
      #     - 5432:5432

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3️⃣ Install backend dependencies
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8  # for linting

      # 4️⃣ Lint backend
      - name: Lint backend
        working-directory: backend
        run: |
          flake8 app --max-line-length=120

      # 5️⃣ Set up Node.js for frontend
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 6️⃣ Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      # 7️⃣ Build frontend
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # 8️⃣ Optional: Test API / build check
      - name: Backend build check
        working-directory: backend
        run: python -m compileall .

      # 9️⃣ Optional: Post success message
      - name: CI Success
        run: echo "✅ CI workflow completed successfully"